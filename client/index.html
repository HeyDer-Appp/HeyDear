<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://heyder.nz/wp-content/uploads/2026/04/cropped-fav-270x270.png" />
    <!-- viewport-fit=cover: the native iOS app's WKWebView renders edge-to-
         edge, under the status bar/notch/Dynamic Island — without this, the
         page has no idea that space exists and env(safe-area-inset-*)
         always reports 0, so anything fixed to the top of the viewport
         (the Home logo, the offline banner) renders straight under the
         notch instead of below it. Harmless on a normal browser tab. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="HeyDer — Weekly dinners with people looking for someone like YOU. Auckland's curated social dining experience. Every Tuesday at 7pm." />
    <meta name="theme-color" content="#0a0f1a" />
    <meta property="og:title" content="HeyDer — Weekly Tuesday Dinners" />
    <meta property="og:description" content="Curated dinners with strangers who actually want to meet you. Auckland, every Tuesday." />
    <meta property="og:image" content="https://heyder.nz/wp-content/uploads/2026/04/medium-shot-friends-eating-pizza.jpg-scaled.jpeg" />
    <title>HeyDer — Weekly Tuesday Dinners in Auckland</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://heyder.nz/wp-content/uploads/2026/04/logo1.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HeyDer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>
